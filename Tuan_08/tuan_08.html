<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bookstore Online</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<style>
    .featured {
        background-color: pink;
    }
</style>

<body>
    <div id="book-list">
        <div class="book" , data-genre="fiction">
            <h3>Đắc Nhân Tâm</h3>
            <p class="price">120.000đ</p>
        </div>

        <div class="book">
            <h3>Tư Duy Nhanh và Chậm</h3>
            <p class="price">150.000đ</p>
        </div>

        <div class="book">
            <h3>Nhà Giả Kim</h3>
            <p class="price">89.000đ</p>

            <h2 id="title">Sách bán chạy</h2>
            <p id="price">120.000đ</p>
            <input type="text" id="search-box" placeholder="Nhập tên sách">
            <button id="btnAdd">Them mau</button>
            <button id="btnRemove">Xoa mau</button>

            <script>
                var book = $(".book:first")
                $("#btnAdd").click(() => {
                    book.addClass("featured")
                })
                $("#btnRemove").click(() => {
                    book.removeClass("featured")
                })
            </script>
        </div>
    </div>
</body>

</html>
