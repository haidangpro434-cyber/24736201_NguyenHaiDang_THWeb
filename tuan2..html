<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        display: grid;
        grid-template-areas: "header" "search" "main" "footer";
    }
    
    .header {
        display: flex;
        justify-content: space-between;
        padding: 10px;
    }
    
    .search {
        padding: 10px;
    }
    
    .main {
        padding: 10px;
    }
    
    .footer {
        padding: 10px;
    }
    
    li {
        display: inline-block;
        margin: 10px;
    }
</style>

<body>
    <div class="container">
        <div class="header">
            <div>
                <div class="logo"><img src="./images/logo.png" alt=""></div>
                <div class="title"><img src="./images/text.png" alt=""></div>
            </div>
            <div>
                <ul>
                    <li>Images</li>
                    <li>Videos</li>
                    <li>Shopping</li>
                    <li>News</li>
                </ul>
            </div>
            <div>
                <div class="avatar"><img src="./images/avatar.png" alt=""></div>
                <div class="username">Sofia Perez</div>
                <div class="muiten"><img src="./images/muiten.png" alt=""></div>
            </div>
        </div>
        <div class="search">content</div>
        <div class="main">main</div>
        <div class="footer">footer</div>
    </div>
</body>

</html>
