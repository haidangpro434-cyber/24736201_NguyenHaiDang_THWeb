<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var a = prompt("Nhap so a")
        var b = prompt("Nhap so b")

        var cong = document.createElement("button")
        cong.textContent = "Cong"
        cong.onclick = () => {
            alert(parseInt(a) + parseInt(b))
        }
        document.body.appendChild(cong)

        var tru = document.createElement("button")
        tru.textContent = "Tru"
        tru.onclick = () => {
            alert(parseInt(a) - parseInt(b))
        }
        document.body.appendChild(tru)

        var nhan = document.createElement("button")
        nhan.textContent = "Nhan"
        nhan.onclick = () => {
            alert(parseInt(a) * parseInt(b))
        }
        document.body.appendChild(nhan)

        var chia = document.createElement("button")
        chia.textContent = "Chia"
        chia.onclick = () => {
            alert(parseInt(a) / parseInt(b))
        }
        document.body.appendChild(chia)
    </script>
</body>

</html>
